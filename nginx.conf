events {
    worker_connections 1024;
}

http {
    upstream llm_cluster {
        # 'least_conn' routes new prompts to the machine with the fewest active requests
        least_conn; 
        
        # Windows Desktop Nodes (LM Studio via Tailscale)
        server 100.114.45.16:1234 max_fails=3 fail_timeout=30s;
        server 100.66.86.126:1234 max_fails=3 fail_timeout=30s;
        server 100.117.2.48:1234 max_fails=3 fail_timeout=30s;
        server 100.88.159.1:1234 max_fails=3 fail_timeout=30s;
        
        # Alienware Node (Uncomment and replace ALIENWARE_IP with actual Tailscale IP)
        server 100.74.150.48:1234 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 4000;

        location / {
            proxy_pass http://llm_cluster;
            
            # --- AI STREAMING FIXES ---
            # Disables buffering so tokens stream to the UI instantly
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            
            # --- AI TIMEOUT FIXES ---
            # Allows the LLM up to 5 minutes to generate a response before timing out
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            
            # --- AUTO-FAILOVER ---
            # If an LM Studio instance crashes or hangs, NGINX instantly routes the prompt to the next GPU
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }

        location /status {
            stub_status on;
            access_log off;
        }

    }
}
