services:
  # Database
  budai-db:
    image: timescale/timescaledb-ha:pg15
    container_name: budai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-budai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Background Tasks
  budai-redis:
    image: redis:7-alpine
    container_name: budai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Main API Orchestrator
  budai-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: budai-api
    depends_on:
      budai-db:
        condition: service_healthy
      budai-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@budai-db:5432/${POSTGRES_DB:-budai}
      - REDIS_URL=redis://budai-redis:6379/0
      - OLLAMA_BASE_URL=http://100.74.150.48:1234/v1
      - VLLM_SUMMARY_URL=http://100.74.150.48:1234/v1
      - NEWSDATA_API_KEY=${NEWSDATA_API_KEY}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - HF_TOKEN=${HF_TOKEN}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL}
      - COLLECTOR_ENDPOINT=http://signoz-ingester-1:4317
      - PREFECT_API_URL=${PREFECT_CLOUD_API_URL}
      - PREFECT_API_KEY=${PREFECT_CLOUD_API_KEY}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    restart: always
    networks:
      - default
      - signoz-network

  # Prefect Server (OSS)
  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: prefect-server
    depends_on:
      budai-db:
        condition: service_healthy
    ports:
      - "4200:4200"
    environment:
      - PREFECT_SERVER_DATABASE_CONNECTION_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@budai-db:5432/${POSTGRES_DB:-budai}
      - PREFECT_API_URL=http://127.0.0.1:4200/api
    command: prefect server start --host 0.0.0.0
    restart: always
    networks:
      - default

  # Prefect Worker (Cloud Deployments)
  worker-cloud:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: worker-cloud
    depends_on:
      budai-db:
        condition: service_healthy
      budai-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@budai-db:5432/${POSTGRES_DB:-budai}
      - REDIS_URL=redis://budai-redis:6379/0
      - OLLAMA_BASE_URL=http://100.74.150.48:1234/v1
      - VLLM_SUMMARY_URL=http://100.74.150.48:1234/v1
      - HF_TOKEN=${HF_TOKEN}
      - PREFECT_API_URL=${PREFECT_CLOUD_API_URL}
      - PREFECT_API_KEY=${PREFECT_CLOUD_API_KEY}
      - COLLECTOR_ENDPOINT=http://signoz-ingester-1:4317
      - PREFECT_LOGGING_EXTRA_LOGGERS=sqlalchemy.engine,httpx,langchain,uvicorn
    volumes:
      - .:/app
    command: python serve_cloud.py
    restart: always
    networks:
      - default
      - signoz-network

  # Prefect Worker (OSS Deployments)
  worker-oss:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: worker-oss
    depends_on:
      budai-db:
        condition: service_healthy
      budai-redis:
        condition: service_healthy
      prefect-server:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@budai-db:5432/${POSTGRES_DB:-budai}
      - REDIS_URL=redis://budai-redis:6379/0
      - OLLAMA_BASE_URL=http://100.74.150.48:1234/v1
      - VLLM_SUMMARY_URL=http://100.74.150.48:1234/v1
      - HF_TOKEN=${HF_TOKEN}
      - PREFECT_API_URL=http://prefect-server:4200/api
      - COLLECTOR_ENDPOINT=http://signoz-ingester-1:4317
      - PREFECT_LOGGING_EXTRA_LOGGERS=sqlalchemy.engine,httpx,langchain,uvicorn
    volumes:
      - .:/app
    command: python serve_oss.py
    restart: always
    networks:
      - default
      - signoz-network

volumes:
  postgres_data:

networks:
  default:
  signoz-network:
    external: true
