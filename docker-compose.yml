services:
  # Database
  budai-db:
    image: timescale/timescaledb-ha:pg15
    container_name: budai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-budai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Background Tasks
  budai-redis:
    image: redis:7-alpine
    container_name: budai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Main API Orchestrator
  budai-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: budai-api
    dns:
      - 100.100.100.100
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      budai-db:
        condition: service_healthy
      budai-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@budai-db:5432/${POSTGRES_DB:-budai}
      - REDIS_URL=redis://budai-redis:6379/0
      - OLLAMA_BASE_URL=http://ai-loadbalancer:4000/v1
      - VLLM_SUMMARY_URL=http://ai-loadbalancer:4000/v1
      - NEWSDATA_API_KEY=${NEWSDATA_API_KEY}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - HF_TOKEN=${HF_TOKEN}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL}
      - LANGFUSE_SECRET_KEY=sk-lf-2378a41f-3adf-4c82-99d6-805190d46f73
      - LANGFUSE_PUBLIC_KEY=pk-lf-1f672f40-d754-429b-9506-eb098b631da5
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_BASE_URL=http://langfuse-web:3000
      - PREFECT_API_URL=${PREFECT_CLOUD_API_URL}
      - PREFECT_API_KEY=${PREFECT_CLOUD_API_KEY}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    restart: always
    networks:
      - default

  # Prefect Server (OSS)
  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: prefect-server
    depends_on:
      budai-db:
        condition: service_healthy
    ports:
      - "4200:4200"
    environment:
      - PREFECT_SERVER_DATABASE_CONNECTION_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@budai-db:5432/${POSTGRES_DB:-budai}
      - PREFECT_API_URL=http://127.0.0.1:4200/api
      - PREFECT_API_DATABASE_CONNECTION_POOL_SIZE=50
      - PREFECT_API_DATABASE_CONNECTION_TIMEOUT=60
    command: prefect server start --host 0.0.0.0
    restart: always
    networks:
      - default

  # Prefect Worker (Cloud Deployments)
  worker-cloud:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: worker-cloud
    depends_on:
      budai-db:
        condition: service_healthy
      budai-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@budai-db:5432/${POSTGRES_DB:-budai}
      - REDIS_URL=redis://budai-redis:6379/0
      - OLLAMA_BASE_URL=http://ai-loadbalancer:4000/v1
      - VLLM_SUMMARY_URL=http://ai-loadbalancer:4000/v1
      - HF_TOKEN=${HF_TOKEN}
      - PREFECT_API_URL=${PREFECT_CLOUD_API_URL}
      - PREFECT_API_KEY=${PREFECT_CLOUD_API_KEY}
      - LANGFUSE_SECRET_KEY=sk-lf-2378a41f-3adf-4c82-99d6-805190d46f73
      - LANGFUSE_PUBLIC_KEY=pk-lf-1f672f40-d754-429b-9506-eb098b631da5
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_BASE_URL=http://langfuse-web:3000
      - PREFECT_LOGGING_EXTRA_LOGGERS=sqlalchemy.engine,httpx,langchain,uvicorn
    volumes:
      - .:/app
    command: python serve_cloud.py
    restart: always
    networks:
      - default

  # Prefect Worker (OSS Deployments)
  worker-oss:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: worker-oss
    depends_on:
      budai-db:
        condition: service_healthy
      budai-redis:
        condition: service_healthy
      prefect-server:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@budai-db:5432/${POSTGRES_DB:-budai}
      - REDIS_URL=redis://budai-redis:6379/0
      - OLLAMA_BASE_URL=http://ai-loadbalancer:4000/v1
      - VLLM_SUMMARY_URL=http://ai-loadbalancer:4000/v1
      - HF_TOKEN=${HF_TOKEN}
      - PREFECT_API_URL=http://prefect-server:4200/api
      - LANGFUSE_SECRET_KEY=sk-lf-2378a41f-3adf-4c82-99d6-805190d46f73
      - LANGFUSE_PUBLIC_KEY=pk-lf-1f672f40-d754-429b-9506-eb098b631da5
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_BASE_URL=http://langfuse-web:3000
      - PREFECT_LOGGING_EXTRA_LOGGERS=sqlalchemy.engine,httpx,langchain,uvicorn
    volumes:
      - .:/app
    command: python serve_oss.py
    restart: always
    networks:
      - default

  # Langfuse infrastructure
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - CLICKHOUSE_PASSWORD=budai_clickhouse_pass
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - default

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9001:9000"
      - "9090:9001"
    volumes:
      - minio_data:/data
    networks:
      - default

  minio-setup:
    image: minio/mc
    container_name: minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " sleep 5; mc alias set langfuse_s3 http://minio:9000 minioadmin minioadmin; mc mb langfuse_s3/langfuse-events || true; mc mb langfuse_s3/langfuse-media || true; exit 0; "
    networks:
      - default

  langfuse-web:
    image: langfuse/langfuse:latest
    container_name: langfuse-web
    restart: always
    depends_on:
      budai-db:
        condition: service_healthy
      clickhouse:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "3030:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@budai-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3030
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - REDIS_CONNECTION_STRING=redis://budai-redis:6379/0
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - CLICKHOUSE_PASSWORD=budai_clickhouse_pass
      - CLICKHOUSE_MIGRATION_URL=clickhouse://default:budai_clickhouse_pass@clickhouse:9000
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=${LANGFUSE_S3_EVENT_UPLOAD_BUCKET}
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET}
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=${LANGFUSE_S3_EVENT_UPLOAD_PREFIX}
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=${LANGFUSE_S3_EVENT_UPLOAD_REGION}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT}
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE}
      - LANGFUSE_AUTO_CLICKHOUSE_MIGRATION_DISABLED=${LANGFUSE_AUTO_CLICKHOUSE_MIGRATION_DISABLED}
      - LANGFUSE_CACHE_API_KEY_ENABLED=${LANGFUSE_CACHE_API_KEY_ENABLED}
      - LANGFUSE_CACHE_PROMPT_ENABLED=${LANGFUSE_CACHE_PROMPT_ENABLED}
    networks:
      - default

  langfuse-worker:
    image: langfuse/langfuse-worker:latest
    container_name: langfuse-worker
    depends_on:
      budai-db:
        condition: service_healthy
      clickhouse:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@budai-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3030
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - REDIS_CONNECTION_STRING=redis://budai-redis:6379/0
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - CLICKHOUSE_PASSWORD=budai_clickhouse_pass
      - CLICKHOUSE_MIGRATION_URL=clickhouse://default:budai_clickhouse_pass@clickhouse:9000
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=${LANGFUSE_S3_EVENT_UPLOAD_BUCKET}
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET}
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=${LANGFUSE_S3_EVENT_UPLOAD_PREFIX}
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=${LANGFUSE_S3_EVENT_UPLOAD_REGION}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT}
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE}
      - LANGFUSE_AUTO_CLICKHOUSE_MIGRATION_DISABLED=${LANGFUSE_AUTO_CLICKHOUSE_MIGRATION_DISABLED}
      - LANGFUSE_CACHE_API_KEY_ENABLED=${LANGFUSE_CACHE_API_KEY_ENABLED}
      - LANGFUSE_CACHE_PROMPT_ENABLED=${LANGFUSE_CACHE_PROMPT_ENABLED}
    networks:
      - default

  ai-loadbalancer:
    image: nginx:alpine
    container_name: ai-loadbalancer
    ports:
      - "4000:4000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - default

volumes:
  postgres_data:
  clickhouse_data:
  minio_data:

networks:
  default:

